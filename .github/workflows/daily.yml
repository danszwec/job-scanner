name: Daily job scan

on:
  schedule:
    # Aim for the evening in Israel, but do NOT depend on landing on a given hour.
    # GitHub runs scheduled workflows on a best-effort queue: these drifted from 15 to 56
    # minutes late, then past the hour, and eventually fired 9 hours late. An earlier
    # version of this workflow gated on "is it 18:xx in Israel?" and consequently skipped
    # five days in a row while every run still reported success.
    #
    # The gate below is now "has today's digest already gone out?", so whichever of these
    # fires first on a given Israeli day does the work and the rest stand down. More
    # entries simply mean more chances to catch a day.
    - cron: "15 15 * * *" # 18:15 Israel in summer (IDT, UTC+3)
    - cron: "15 16 * * *" # 18:15 Israel in winter (IST, UTC+2)
    - cron: "15 19 * * *" # safety net if both of the above are delayed
    - cron: "15 22 * * *" # last chance before the Israeli day ends
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and print the digest without sending or writing the ledger"
        type: boolean
        default: false
      seed:
        description: "Record everything currently live as already sent (run once, before go-live)"
        type: boolean
        default: false

# Needs write access to commit the updated ledger (seen.sqlite + jobs.csv) back.
permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout first: the gate reads the ledger to decide whether today is already done.
      - name: Checkout (carries yesterday's ledger)
        uses: actions/checkout@v5

      # Gate on work done, not on the clock. The previous version required the Israel hour
      # to be exactly 18, which silently skipped five consecutive days once GitHub's
      # scheduler started running these hours late. Asking "is there already a clean run
      # for today's Israeli date?" is immune to that: a late run still delivers, and a
      # second cron on the same day stands down.
      #
      # A run that failed to send does NOT count, so a later cron retries it the same day.
      - name: Already sent today?
        id: gate
        run: |
          today=$(TZ=Asia/Jerusalem date +%F)
          done_today=$(python3 - "$today" <<'PY'
          import sqlite3, sys
          try:
              conn = sqlite3.connect("seen.sqlite")
              (n,) = conn.execute(
                  "SELECT COUNT(*) FROM runs WHERE run_date = ? "
                  "AND (failures IS NULL OR failures = '')",
                  (sys.argv[1],),
              ).fetchone()
          except Exception:
              n = 0          # no ledger yet, or an older schema: just run.
          print(n)
          PY
          )
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$done_today" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No clean run recorded for ${today} (Israel) — proceeding."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "${today} (Israel) already has a clean run. Standing down."
          fi

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: uv run pytest tests/ -q

      - name: Run daily scan
        id: scan
        if: steps.gate.outputs.run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run python -m scanner.run --dry-run
          elif [ "${{ inputs.seed }}" = "true" ]; then
            uv run python -m scanner.run --seed
          else
            uv run python -m scanner.run
          fi

      # always(): a failed send must not cost us the scan results. Before this, every
      # email failure also discarded that day's ledger and run-health row.
      - name: Commit updated ledger
        if: always() && steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          # Stage only what exists. jobs.csv is not tracked and is written late in the
          # run, so an early failure leaves it absent — and `git add` on a missing path
          # is a hard error, which would fail the very step that always() exists to run.
          staged=""
          for f in seen.sqlite jobs.csv; do
            [ -f "$f" ] && staged="$staged $f"
          done
          if [ -z "$staged" ]; then
            echo "Nothing to commit — the scan did not get far enough."
            exit 0
          fi
          git config user.name  "job-scanner-bot"
          git config user.email "job-scanner-bot@users.noreply.github.com"
          git add -- $staged
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "chore: daily scan ledger $(date -u +%Y-%m-%d)"
          # Another run (or a push of your own) may have landed since checkout.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Ledger pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying."
            sleep 5
          done
          echo "::error::Could not push the ledger after 3 attempts."
          exit 1
